[package]
name = "generate-starter-pack"
version = "0.2.2"
edition.workspace = true
license.workspace = true
description = "Maintainer-only, one-time-run tool that produces the bundled starter pack's static images (spec 7 US2, research.md R5) — never a runtime dependency of wallpaperd/wallpaperctl/wallpaper-settings"
rust-version = "1.97"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pack-loader = { path = "../../crates/pack-loader" }
schedule-engine = { path = "../../crates/schedule-engine" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
