name: schedule-engine CI

on:
  push:
    branches: [main]
    paths:
      - "crates/schedule-engine/**"
      - "Cargo.toml"
      - ".github/workflows/schedule-engine-ci.yml"
  pull_request:
    paths:
      - "crates/schedule-engine/**"
      - "Cargo.toml"
      - ".github/workflows/schedule-engine-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --package schedule-engine --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --package schedule-engine --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov
        run: cargo llvm-cov --package schedule-engine --fail-under-lines 90
