name: renderer CI

# Covers this crate's full test suite: pure logic (assignment resolution, crossfade
# progress math, config reading/coalescing, the scheduler bridge, D-Bus response
# mapping) plus a real offscreen-GPU pixel-correctness test (tests/gpu_render.rs, skips
# gracefully if no GPU adapter is available on the runner). Running the actual
# `wallpaperd` binary against a live Wayland compositor is manual QA (see
# crates/renderer/README.md) — a Weston-headless smoke test per research.md R6 is
# tracked separately in specs/003-wallpaper-renderer/tasks.md T044, not added here yet.

on:
  push:
    branches: [main]
    paths:
      - "crates/renderer/**"
      - "crates/schedule-engine/**"
      - "crates/pack-loader/**"
      - "Cargo.toml"
      - ".github/workflows/renderer-ci.yml"
  pull_request:
    paths:
      - "crates/renderer/**"
      - "crates/schedule-engine/**"
      - "crates/pack-loader/**"
      - "Cargo.toml"
      - ".github/workflows/renderer-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # libxkbcommon-dev: smithay-client-toolkit's build script requires the headers/
      # .pc file even though this daemon never processes keyboard input (see
      # crates/renderer/README.md's "Building on a real system" section).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: cargo test
        run: cargo test --package renderer --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: cargo clippy
        run: cargo clippy --package renderer --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e4c34c070eb949c  # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: cargo llvm-cov
        run: cargo llvm-cov --package renderer --fail-under-lines 50
