<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Session-bus policy for cosmic-wallpaperd's D-Bus interface (spec 011 US4 FR-015,
  research.md R11).

  What this file does and does not change: the session bus already scopes every
  activity to one user's own session — there is no cross-uid boundary for this policy
  to add on top of. The daemon's actual defense against a co-located, same-uid process
  spamming its methods is the bounded/coalesced request queue in
  crates/renderer/src/dbus_service.rs (FR-014), not this file. This policy exists to
  make that trust boundary explicit and documented (the adversarial audit that
  produced spec 011 specifically flagged that no such file existed anywhere in this
  project's packaging) and as the conventional place a future tighter policy (e.g. a
  send_interface allow-list, if this daemon ever needs one) would be added.

  A stronger authorization scheme (e.g. polkit) was considered and rejected during
  spec 011 planning as disproportionate: nothing this interface exposes crosses a
  privilege boundary (no root action, no other user's data) — only a same-uid process
  boundary, which the request-queue bound above already contains the impact of.
-->
<busconfig>
  <policy context="default">
    <allow own="com.system76.CosmicDynamicWallpaper1"/>
    <allow send_destination="com.system76.CosmicDynamicWallpaper1"
           send_interface="com.system76.CosmicDynamicWallpaper1.Daemon"/>
    <allow receive_sender="com.system76.CosmicDynamicWallpaper1"/>
  </policy>
</busconfig>
