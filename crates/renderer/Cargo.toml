[package]
name = "renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wallpaper renderer daemon (wallpaperd) for the dynamic wallpaper project — pure-logic subset only, see README.md"
rust-version = "1.97"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
pack-loader = { path = "../pack-loader" }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro", "calloop"] }
smithay-client-toolkit = "0.20.0"
wayland-client = { version = "0.31", features = ["system"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
wgpu = "0.20"
raw-window-handle = "0.6"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
bytemuck = { version = "1.25", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
