[package]
name = "wallpaper-ipc"
version = "0.2.2"
edition.workspace = true
license.workspace = true
description = "Shared cosmic-config schema types and D-Bus client for the Cosmic Dynamic Wallpaper project — single source of truth for cosmic-wallpaperd/cosmic-wallpaperctl/cosmic-wallpaper-settings"
rust-version = "1.97"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
pack-loader = { path = "../pack-loader" }
serde = { version = "1.0", features = ["derive"] }
# No "calloop" feature: only the daemon (crates/renderer) watches these entries live —
# this crate stays free of that dependency (contracts/wallpaper-ipc-crate.md).
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Reconstructs cosmic-config's own `dirs::config_dir()`-based on-disk convention so
# `save()` can tighten the written directory's permissions afterward (spec 011 US7
# FR-030, research.md R25) — same precedent as `pack-loader::registry`'s lock-file
# path. `cosmic-config` itself already depends on this crate transitively.
dirs = "6.0"
# Surfaces a config-read error's detail when `load` falls back to defaults (spec 011
# US6 FR-023, research.md R18) instead of discarding it silently. Already resolved in
# `Cargo.lock` as a transitive dependency (`renderer`/`wallpaper-settings` both already
# depend on it directly) — no new crate enters the build.
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
