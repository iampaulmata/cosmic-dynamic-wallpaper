[package]
name = "wallpaperctl"
version = "0.2.2"
edition.workspace = true
license.workspace = true
description = "CLI control surface for the Cosmic Dynamic Wallpaper daemon"
rust-version = "1.97"

[[bin]]
name = "cosmic-wallpaperctl"
path = "src/main.rs"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
pack-loader = { path = "../pack-loader" }
wallpaper-ipc = { path = "../wallpaper-ipc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
