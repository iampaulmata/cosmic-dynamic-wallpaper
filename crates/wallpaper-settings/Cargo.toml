[package]
name = "wallpaper-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone libcosmic settings GUI for the Cosmic Dynamic Wallpaper daemon"
rust-version = "1.97"

[[bin]]
name = "cosmic-wallpaper-settings"
path = "src/main.rs"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
pack-loader = { path = "../pack-loader" }
wallpaper-ipc = { path = "../wallpaper-ipc" }
# Same version/features every other crate in this workspace pins (pack-loader,
# renderer, wallpaperctl, schedule-engine) — needed directly (not just transitively)
# to name `DateTime<Local>`/`TimeDelta` for the Timeline page's client-side schedule
# snapshot (`pack_display::resolve_schedule_snapshot`).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Same git pin as cosmic-config elsewhere in this workspace (spec 7 research.md R1) —
# constitution Principle IX requires any settings GUI to use libcosmic widgets/theme
# tokens, not GTK/Qt/a raw web view. Deliberately NOT a dependency on crates/renderer
# (plan.md Constitution Check finding 1) — this crate never links wgpu/
# smithay-client-toolkit/wayland-client.
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["wgpu", "wayland", "winit", "tokio", "xdg-portal", "a11y", "multi-window"] }

[dev-dependencies]
tempfile = "3.27"
# Test-fixture-only: writes synthetic PNGs for pack_display.rs's unit tests (spec 008
# T002/T032-T034) — same version/features wallpaperctl already uses for the same
# purpose, not a new mechanism this crate depends on at runtime.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
