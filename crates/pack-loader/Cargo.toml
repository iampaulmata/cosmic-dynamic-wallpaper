[package]
name = "pack-loader"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Pack manifest parsing and loading for the Cosmic Dynamic Wallpaper daemon"
rust-version = "1.97"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "bmp", "tiff",
] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
humantime = "2.4"
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }
# Cross-process exclusive lock around Registry::persist() (spec 011 US6 FR-022,
# research.md R17) — a small, pure-safe-Rust wrapper over the platform advisory-lock
# primitive (flock on Unix), chosen specifically so this crate doesn't have to open its
# own unsafe FFI boundary for this (constitution: unsafe only in vetted, documented
# shims).
fd-lock = "4"
# Resolves the standard `cosmic-config` directory (spec 011 US6 FR-022, research.md
# R17/R25's shared convention) so the registry lock file lives next to the config it
# guards. Already resolved in `Cargo.lock` as a transitive dependency of
# `cosmic-config` (same precedent as `wallpaper-settings`' own direct `dirs` use) — no
# new crate enters the build.
dirs = "6.0"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
