[package]
name = "pack-loader"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Pack manifest parsing and loading for the Cosmic Dynamic Wallpaper daemon"
rust-version = "1.97"

[dependencies]
schedule-engine = { path = "../schedule-engine" }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "bmp", "tiff",
] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
humantime = "2.4"
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
