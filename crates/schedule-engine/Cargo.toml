[package]
name = "schedule-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure, deterministic solar/clock scheduling logic for the dynamic wallpaper daemon"
rust-version = "1.97"

[dependencies]
sunrise = "3.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.11"
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
